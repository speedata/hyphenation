name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The go line of go.mod is the oldest Go we promise, stable the one
    # users get.
    strategy:
      fail-fast: false
      matrix:
        go: [go.mod, stable]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go from go.mod
        if: matrix.go == 'go.mod'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up the latest Go
        if: matrix.go == 'stable'
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        # A mutex guards the word cache, so run the race detector as well.
        run: go test -race ./...
